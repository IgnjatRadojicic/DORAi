name: release

# A tag vX.Y.Z builds the desktop installers, the Android APK and the CLI, and attaches them to a draft
# GitHub Release. A person checks the draft and publishes it. The server image comes from server-image.yml.
# Asset names carry no version, so the website links to releases/latest/download/<name> and never changes.
# How to cut a release: docs/plan-releases.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches dorai.version
        run: |
          version=$(sed -n 's/^dorai\.version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match dorai.version=$version in gradle.properties"
            exit 1
          fi

  desktop:
    needs: check
    strategy:
      matrix:
        include:
          - os: windows-latest
            format: msi
            task: packageMsi
            asset: DORAi-windows.msi
          - os: macos-latest
            format: dmg
            task: packageDmg
            asset: DORAi-macos.dmg
          - os: ubuntu-latest
            format: deb
            task: packageDeb
            asset: DORAi-linux.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # macOS: the Developer ID certificate goes into a temporary keychain; Gradle signs, then Apple notarizes.
      - name: Import the macOS signing certificate
        if: matrix.format == 'dmg'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 is not set: the DMG is not signed, macOS will warn users."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/certificate.p12"
          echo "MACOS_SIGNED=true" >> "$GITHUB_ENV"
      # Each installer can only be built on its own operating system.
      - name: Build installer
        env:
          DORAI_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          DORAI_MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          DORAI_MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          DORAI_MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          ./gradlew :app:${{ matrix.task }} --console=plain
          if [ "${MACOS_SIGNED:-}" = "true" ]; then ./gradlew :app:notarizeDmg --console=plain; fi
      - name: Name the asset
        run: |
          mkdir dist
          cp app/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }} "dist/${{ matrix.asset }}"
      # Windows: signtool from the Windows SDK signs the MSI with the code-signing certificate and a timestamp,
      # so the signature stays valid after the certificate expires.
      - name: Sign the Windows installer
        if: matrix.format == 'msi'
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "::warning::WINDOWS_CERTIFICATE_PFX_BASE64 is not set: the MSI is not signed, Windows SmartScreen will warn users."
            exit 0
          fi
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.pfx"
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort | tail -1)
          "$signtool" sign //fd SHA256 //td SHA256 //tr http://timestamp.digicert.com             //f "$RUNNER_TEMP/certificate.pfx" //p "$CERTIFICATE_PASSWORD" "dist/${{ matrix.asset }}"
          "$signtool" verify //pa "dist/${{ matrix.asset }}"
          rm "$RUNNER_TEMP/certificate.pfx"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Every release must be signed with the same key, or users have to uninstall before updating.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is missing, see docs/plan-releases.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        env:
          DORAI_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          DORAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DORAI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DORAI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --console=plain
      # Only a signed build is named androidApp-release.apk; an unsigned one would fail this copy.
      - name: Name the asset
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/DORAi-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DORAi-android.apk
          path: dist/DORAi-android.apk
          if-no-files-found: error

  cli:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build CLI
        run: ./gradlew :cli:distZip --console=plain
      - name: Name the asset
        run: |
          mkdir dist
          cp cli/build/distributions/dorai-*.zip dist/dorai-cli.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dorai-cli.zip
          path: dist/dorai-cli.zip
          if-no-files-found: error

  release:
    needs: [desktop, android, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "DORAi ${GITHUB_REF_NAME#v}" \
            --generate-notes
