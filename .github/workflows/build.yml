name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain

  # The RoI package against the EBA DORA taxonomy, offline with Arelle. Skipped until the repository
  # variable EBA_TAXONOMY_URL names the taxonomy zip (the team approves that download first).
  roi-taxonomy:
    runs-on: ubuntu-latest
    if: ${{ vars.EBA_TAXONOMY_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arelle
        # Pin it with the repository variable ARELLE_VERSION once the team has chosen a version.
        env:
          ARELLE_VERSION: ${{ vars.ARELLE_VERSION }}
        run: pip install "arelle-release${ARELLE_VERSION:+==$ARELLE_VERSION}"
      - name: Fetch the taxonomy
        run: curl --fail --silent --show-error --location "${{ vars.EBA_TAXONOMY_URL }}" -o "$RUNNER_TEMP/eba-taxonomy.zip"
      - name: Validate the FinPay package
        run: EBA_TAXONOMY="$RUNNER_TEMP/eba-taxonomy.zip" sh scripts/validate-roi.sh

  # The release workflow builds the same Dockerfile; a broken image shows up here instead of on the tag.
  # One platform is enough to catch it, and nothing is pushed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
