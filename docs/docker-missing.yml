# What the Docker deployment (deploy/, Dockerfile, server-image workflow) still needs.
# The stack runs today: server on HTTP with the register in PostgreSQL, nightly backups.
# Each item: what is missing, why it matters, who owns it, when it lands.
# Remove an item when it is done.

image:
ci-and-release:
  - id: first-release
    missing: Push the first version tag (for example v0.1.0) so the workflow publishes the image.
    why: Until then ghcr.io/ignjatradojicic/dorai-server does not exist and firms cannot pull it.
    owner: Ignjat
    phase: 6

  - id: package-visibility
    missing: Make the GHCR package public after the first publish, or give firms pull credentials.
    why: New GHCR packages are private, so docker compose pull fails for firms.
    owner: Ignjat
    phase: 6

operations:
  - id: offsite-backups
    missing: Copy deploy/backups to storage off the host.
    why: Backups on the same disk do not survive a disk failure. This is the firm's job; docs/deploy.md says so.
    owner: each firm
    phase: at install
